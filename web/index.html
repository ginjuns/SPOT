<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPOT - 나에게 맞는 정부 지원 찾기</title>
  <meta name="description" content="받을 수 있는 정부·지자체 지원을 이름, 분야, 내 조건으로 찾아보세요. 말로 물어볼 수도 있어요.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fff8f1">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
</head>
<body>
  <div class="page has-fab home">
    <header class="hero">
      <div class="hero-top">
        <p class="brand">SPOT</p>
        <!-- 화면 설정: 글씨 크기(4단계), 또렷한 화면(어두운 바탕에 밝은 글씨) -->
        <div class="hero-toggles">
          <div class="font-size" role="group" aria-label="글씨 크기">
            <span class="font-name">글씨</span>
            <button type="button" class="hero-pill" data-font="down">작게</button>
            <span class="font-level sr-only" aria-live="polite">보통</span>
            <button type="button" class="hero-pill" data-font="up">크게</button>
          </div>
          <button type="button" class="hero-pill icon" data-setting="contrast" aria-label="또렷한 화면" title="또렷한 화면">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <span class="state sr-only">꺼짐</span>
          </button>
        </div>
      </div>
      <div class="hero-greet">
        <p class="hello">안녕하세요</p>
        <h1>오늘은 어떤 지원을<br> 찾아볼까요?</h1>
      </div>
      <form class="search-form" id="search-form">
        <input type="search" id="q" maxlength="50" placeholder="예: 기초연금, 난방비" aria-label="이름이나 낱말로 찾기" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="btn">찾기</button>
      </form>
    </header>

    <main>
      <h2 class="home-title">분야로 찾기</h2>
      <!-- 분야 값과 이름은 data/options.json 의 category 와 같게 둔다 -->
      <div class="row tiles">
        <a class="btn tile" href="search.html?result=1&amp;category=%EC%83%9D%ED%99%9C%EC%95%88%EC%A0%95"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9l2 6 2-5 2 5 2-6M7 12h10"/></svg>생활비</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EB%B3%B4%EA%B1%B4%C2%B7%EC%9D%98%EB%A3%8C"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 7v10M7 12h10"/></svg>병원·건강</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EB%B3%B4%ED%98%B8%C2%B7%EB%8F%8C%EB%B4%84"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>돌봄</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EC%A3%BC%EA%B1%B0%C2%B7%EC%9E%90%EB%A6%BD"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6"/></svg>집·주거</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EA%B3%A0%EC%9A%A9%C2%B7%EC%B0%BD%EC%97%85"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></svg>일자리</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EC%9E%84%EC%8B%A0%C2%B7%EC%B6%9C%EC%82%B0"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 14c1 1.2 5 1.2 6 0M9.5 10h.01M14.5 10h.01"/></svg>임신·출산</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EB%B3%B4%EC%9C%A1%C2%B7%EA%B5%90%EC%9C%A1"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>아이·교육</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EB%AC%B8%ED%99%94%C2%B7%ED%99%98%EA%B2%BD"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>문화·여가</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%ED%96%89%EC%A0%95%C2%B7%EC%95%88%EC%A0%84"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>안전·편의</a>
        <a class="btn tile" href="search.html?result=1&amp;category=%EB%86%8D%EB%A6%BC%EC%B6%95%EC%82%B0%EC%96%B4%EC%97%85"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20v-8M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 14c0-3 2.5-5 7-5 0 3.5-2.5 5-7 5z"/></svg>농사·어업</a>
      </div>

      <h2 class="home-title">이렇게 찾아보세요</h2>
      <!-- 낱말은 주소의 # 뒤에 담는다 (서버로 전송되지 않는다). 찾는 횟수 순위가 아니라 예시다 -->
      <ol class="popular">
        <li><a href="search.html?result=1#q=%EA%B8%B0%EC%B4%88%EC%97%B0%EA%B8%88"><span class="rank">1</span>기초연금</a></li>
        <li><a href="search.html?result=1#q=%EB%82%9C%EB%B0%A9%EB%B9%84"><span class="rank">2</span>난방비</a></li>
        <li><a href="search.html?result=1#q=%EB%85%B8%EC%9D%B8%EC%9D%BC%EC%9E%90%EB%A6%AC"><span class="rank">3</span>노인일자리</a></li>
        <li><a href="search.html?result=1#q=%EB%B3%91%EC%9B%90%EB%B9%84"><span class="rank">4</span>병원비</a></li>
      </ol>

      <h2 class="home-title">내 조건으로 찾기</h2>
      <div class="panel">
        <p>나이대와 사는 곳을 하나씩 고르면 맞는 지원만 보여 드려요.</p>
        <a class="btn btn-primary" href="search.html">조건 골라서 찾기</a>
      </div>
    </main>

    <p class="notice">이 서비스는 혜택을 찾아 안내해 드려요. 받을 수 있는지는 신청하는 곳에서 최종 확인해 주세요.</p>
  </div>

  <a class="chat-fab" href="chat.html" aria-label="궁금한 것 물어보기"><svg class="fab-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg><span class="fab-label">물어보기</span></a>

  <script src="js/nav.js"></script>

</body>
</html>
